<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 78% 40%,#34408a 0%,#161d4a 45%,#0c1030 100%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 10% 20%,#fff9,transparent),radial-gradient(1.5px 1.5px at 30% 80%,#fff7,transparent),radial-gradient(2px 2px at 55% 12%,#fff8,transparent),radial-gradient(1.5px 1.5px at 45% 60%,#fff6,transparent),radial-gradient(2px 2px at 5% 70%,#fff8,transparent),radial-gradient(1.5px 1.5px at 60% 90%,#fff6,transparent)}
.moon{position:absolute;right:-120px;bottom:-260px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9ecf3,#9aa0b0 70%);opacity:.9}
.phone{position:absolute;right:120px;top:40px;width:300px;height:560px;border-radius:40px;background:#0b0e22;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 3px #ffffff22;transform:rotate(6deg)}
.screen{width:100%;height:100%;border-radius:30px;background:url(portrait.png) center 18%/cover}
.txt{position:absolute;left:70px;top:95px;width:620px}
h1{margin:0;font-size:112px;line-height:.95;font-weight:900;letter-spacing:1px;text-shadow:0 8px 0 #ff9a3c,0 16px 30px rgba(0,0,0,.4)}
p{margin:34px 0 0;font-size:34px;font-weight:700;opacity:.9;line-height:1.3}
.cta{display:inline-block;margin-top:34px;background:#ffc93c;color:#1b1d2e;font-weight:900;font-size:30px;padding:18px 36px;border-radius:999px;box-shadow:0 8px 0 #d69a10}
.food{position:absolute;width:86px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
</style></head><body>
<div class="bg"></div><div class="stars"></div><div class="moon"></div>
<div class="phone"><div class="screen"></div></div>
<img class="food" src="burger.png" style="left:640px;top:40px;width:110px;transform:rotate(-12deg)">
<img class="food" src="fries.png" style="left:1090px;top:250px;transform:rotate(14deg)">
<img class="food" src="soda.png" style="left:650px;top:470px;transform:rotate(-8deg)">
<img class="food" src="pizza.png" style="left:1080px;top:470px;width:100px;transform:rotate(10deg)">
<img class="food" src="donut-sprinkles.png" style="left:1060px;top:30px;width:80px">
<div class="txt">
  <h1>SPACE<br>DINER</h1>
  <p>Grill it. Serve it. Expand it.<br>Launch your diner to Mars.</p>
  <div class="cta">PLAY FREE &mdash; NO DOWNLOAD</div>
</div>
</body></html>
